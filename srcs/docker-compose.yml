


services:
  mariadb:
    image: mariadb:alel-you
    build:
      context: ./requirements/mariadb/
      dockerfile: Dockerfile
    secrets:
      - SQL_PASSWORD
    container_name: mariadb
    environment:
      SQL_DATABASE: "${SQL_DATABASE:?Error: SQL_DATABASE is not set. Please define it in .env}"
      SQL_USER: "${SQL_USER:?Error: SQL_USER is not set. Please define it in .env}"
      SQL_HOST: "${SQL_HOST:?Error: SQL_HOST is not set. Please define it in .env}"
    env_file:
      - .env
    networks:
      - alel-you
    restart: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - mariadb:/var/lib/mysql

  wordpress:
    image: wordpress:alel-you
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    secrets:
      - SQL_PASSWORD
      - WP_ADMIN_PASS
      - WP_PASS
    environment:
      WP_URL: "${WP_URL:?Error: WP_URL is not set. Please define it in .env}"
      WP_TITLE: "${WP_TITLE:?Error: WP_TITLE is not set. Please define it in .env}"
      WP_ADMIN_USER: "${WP_ADMIN_USER:?Error: WP_ADMIN_USER is not set. Please define it in .env}"
      WP_ADMIN_EMAIL: "${WP_ADMIN_EMAIL:?Error: WP_ADMIN_EMAIL is not set. Please define it in .env}"
      WP_USER: "${WP_USER:?Error: WP_USER is not set. Please define it in .env}"
      WP_EMAIL: "${WP_EMAIL:?Error: WP_EMAIL is not set. Please define it in .env}"
      WP_USER_ROLE: "${WP_USER_ROLE:?Error: WP_USER_ROLE is not set. Please define it in .env}"
    env_file:
      - .env
    networks:
      - alel-you
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
  nginx:
    image: nginx:alel-you
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    env_file:
      - .env
    networks:
      - alel-you
    ports:
      - 443:443
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    

networks:
  alel-you:
    driver: bridge
    name: alel-you

secrets:
  SQL_PASSWORD:
    file: ../secrets/SQL_PASSWORD
  WP_ADMIN_PASS:
    file: ../secrets/WP_ADMIN_PASS
  WP_PASS:
    file: ../secrets/WP_PASS

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${HOME}/data/wordpress'

  mariadb:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${HOME}/data/mariadb'
